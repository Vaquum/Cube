# The explorer on the Origo host, beside the market state cube: host network so the cube
# service is 127.0.0.1:8486; the page is served on 127.0.0.1:8487 only, for a TLS front on
# the host to proxy to, behind the Vaquum portal login. The cube's result volume is mounted
# read-only at the path the service returns.
name: cube-explorer
services:
  explorer:
    build: .
    image: cube-explorer:latest
    network_mode: host
    # Find features: Mill on this host, relayed at /mill/ (tools/mill_relay.py). Both come from this
    # directory's .env, which the deploy keeps; without them the page offers no Find features tab.
    # The Strip: field-data-api on this host, read by the bridge's worker (tools/strip_service.py); an empty
    # FIELD_DATA_URL in .env turns it off. Its first-seen observations persist beside the investigations.
    environment:
      MILL_URL: ${MILL_URL:-}
      MILL_API_SECRET: ${MILL_API_SECRET:-}
      FIELD_DATA_URL: ${FIELD_DATA_URL-http://127.0.0.1:8491}
      FIELD_DATA_API_TOKEN: ${FIELD_DATA_API_TOKEN:-}
    volumes:
      - market-state:/opt/origo/market-state:ro
      - cube-investigations:/var/lib/cube-explorer
    tmpfs:
      - /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8487/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
volumes:
  cube-investigations:
  market-state:
    name: tdw-control-plane_market-state
    external: true
