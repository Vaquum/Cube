name: Deploy explorer
on:
  push:
    branches: [main]
# Workflow level, and never cancel-in-progress: cancelling rsync or compose half way would leave the
# host half updated. A newer push waits behind the running deploy; only one run waits at a time and
# a newer waiting run replaces an older one, so the last commit pushed is the one deployed next.
concurrency:
  group: deploy-main
permissions:
  contents: read
  pull-requests: read
jobs:
  check:
    name: Required checks
    uses: ./.github/workflows/check.yml
  deploy:
    name: Sync to the Origo host and start
    # The condition is explicit on purpose: a failed, skipped or cancelled check leaves this job
    # skipped, and nothing here overrides that. There is no path around the checks.
    needs: check
    if: ${{ needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # The attestation comes before anything touches the host: the checks reported the commit they
      # tested, and it must be the commit this job is about to send.
      - name: The checks ran on this commit
        env:
          CHECKED: ${{ needs.check.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$CHECKED" = "$GITHUB_SHA"
          echo "Deploying $GITHUB_SHA after checks on the same commit." >> "$GITHUB_STEP_SUMMARY"
      - name: Validate deploy configuration
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_DIR"
          test -n "$DEPLOY_KNOWN_HOSTS"
      - name: Stamp the running commit and its pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sha = context.sha;
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Invalid deployment commit');
            const pulls = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              ...context.repo, commit_sha: sha,
            });
            const pull = pulls.find(p => p.merged_at && p.merge_commit_sha === sha &&
              p.base.ref === 'main' && p.base.repo.full_name === `${context.repo.owner}/${context.repo.repo}`);
            if (!pull) throw new Error(`No merged pull request identifies deployment ${sha}`);
            const pr = `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${pull.number}`;
            let html = fs.readFileSync('index.html', 'utf8');
            for (const [name, value] of [['explorer-commit', sha], ['explorer-pr', pr]]) {
              const marker = `<meta name="${name}" content="">`;
              if (html.split(marker).length !== 2) throw new Error(`Missing or duplicate ${name} metadata`);
              html = html.replace(marker, `<meta name="${name}" content="${value}">`);
            }
            fs.writeFileSync('index.html', html);
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Pin the host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Sync the checkout
        run: rsync -az --delete --exclude .git --exclude .env ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/"
      - name: Start
        run: ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_DIR' && docker compose up -d --build --remove-orphans && docker compose ps"
      - name: Check the deployed explorer
        run: |
          probe() { ssh "$DEPLOY_USER@$DEPLOY_HOST" "curl -s -o /dev/null -w '%{http_code}' --max-time 120 http://127.0.0.1:8487/ || printf 000"; }
          code=000
          for attempt in 1 2 3 4 5 6; do
            code=$(probe || printf 000)
            test "$code" = "200" && break
            sleep 10
          done
          test "$code" = "200"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "curl --fail --show-error --max-time 120 http://127.0.0.1:8487/" > "$RUNNER_TEMP/deployed-explorer.html"
          grep -Fq "<meta name=\"explorer-commit\" content=\"$GITHUB_SHA\">" "$RUNNER_TEMP/deployed-explorer.html"
          echo "Verified live Cube revision $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_DIR' && docker compose ps --format '{{.Name}} {{.Status}}'"
